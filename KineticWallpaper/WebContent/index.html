<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kinetic Lyrics</title>
<style>
:root{--accent:#ff4d6d;--text:#f4f1ea;--beat:0;--dim:.55}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#08080b;color:var(--text)}
html.inv,html.inv body{background:#f7f7f4}
/* invert everything except the album covers, so covers keep their real colours on transparent displays */
html.inv #bg,html.inv #anim,html.inv #shade,html.inv #flash,html.inv #tickbox,html.inv #stage,html.inv #info>div,html.inv #sync,html.inv #status,
html.inv #rRib,html.inv #etxt,html.inv #clk,html.inv #dbg{filter:invert(1) hue-rotate(180deg)}
html.inv #light{filter:invert(1) hue-rotate(180deg);mix-blend-mode:multiply}


#bg{position:absolute;inset:0;background-size:100% 100%;background-position:center;opacity:0;transition:opacity 1.5s}
#bg.show{opacity:.6}
#flash{display:none}
#light{position:absolute;left:0;top:0;width:var(--lsz,1600px);height:var(--lsz,1600px);margin:calc(var(--lsz,1600px)/-2) 0 0 calc(var(--lsz,1600px)/-2);
  pointer-events:none;opacity:0;mix-blend-mode:screen;will-change:transform,opacity;display:block;
  transition:transform 1.1s cubic-bezier(.3,.8,.3,1)}
.ws.glint{text-shadow:0 0 calc(var(--glow,.12em)*2.2) color-mix(in srgb,var(--accent) 60%,white)!important;transition:text-shadow .05s}
#shade{position:absolute;inset:0;background:rgba(0,0,0,var(--dim))}
#fg{position:absolute;inset:0}
.reg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;--rw:100vw;--rh:100vh}
#clk{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:none;font:600 28px Consolas,monospace;color:#ffd400;background:rgba(0,0,0,.75);padding:16px 22px;white-space:pre;z-index:9}
html.s1 #bg{display:none!important}
html.s2 #ticker{display:none}html.s2 .outline,html.s2 .ghost{color:var(--text)!important;-webkit-text-stroke:0!important}html.s2 .ws.hot{text-shadow:none}
html.s3 .u,html.s3 .exit{transition:none!important}html.s3 .cam{animation:none}html.s3 .ws{transition:none}
/* transition themes: timing per theme, extra effects via individual 'translate'/'clip-path' so they don't fight the layout transform */
.t-slam{transition:transform .85s cubic-bezier(.16,1,.3,1),opacity .3s .1s}
.t-drop{transition:transform .9s cubic-bezier(.34,1.45,.6,1),opacity .25s .1s}
.t-zoom{transition:transform .7s cubic-bezier(.2,.9,.25,1),opacity .4s .05s}
.t-spin{transition:transform 1s cubic-bezier(.2,1.2,.3,1),opacity .35s .1s}
.t-fade{transition:transform 1.4s cubic-bezier(.2,.7,.2,1),opacity .9s}
.t-wipe{transition:clip-path .55s cubic-bezier(.7,0,.2,1) .05s,opacity .01s .05s;clip-path:inset(0 100% 0 0)}
.t-wipe.on{clip-path:inset(-40% -12% -40% -12%)}
.t-rise{transition:clip-path .6s cubic-bezier(.7,0,.2,1) .05s,transform .7s cubic-bezier(.16,1,.3,1),opacity .01s .05s;clip-path:inset(100% 0 0 0)}
.t-rise.on{clip-path:inset(-40% -12% -40% -12%)}
.t-glitch{transition:opacity .01s}
.t-glitch.on{animation:glitch .45s steps(1) both}
@keyframes glitch{0%{translate:-40px 6px;opacity:.9}12%{translate:28px -10px}24%{translate:-14px 3px;opacity:.4}36%{translate:22px 0;opacity:1}48%{translate:-6px -4px}60%{translate:10px 2px;opacity:.6}72%{translate:-3px 0;opacity:1}100%{translate:0 0}}
.t-pop{transition:transform .55s cubic-bezier(.3,1.8,.5,1),opacity .15s .05s}
.t-gravity{transition:transform .95s cubic-bezier(.3,1.35,.55,1) .18s,opacity .01s .18s}
.t-carry{transition:transform .75s cubic-bezier(.65,0,.25,1),opacity .01s}
.t-collide{transition:opacity .01s}
.carried .ws{opacity:.4}.carried .ws.on{opacity:1}
.t-flip,.t-swing{transition:transform .8s cubic-bezier(.2,1.25,.35,1),opacity .2s .05s;transform-origin:50% 50%;backface-visibility:hidden}
.t-stretch{transition:transform .6s cubic-bezier(.15,1.3,.3,1),opacity .15s}
.t-squash{transition:transform .5s cubic-bezier(.3,1.9,.5,1),opacity .1s}
.t-rubber{transition:transform .9s cubic-bezier(.2,2.2,.4,.8),opacity .1s}
.t-skew{transition:transform .75s cubic-bezier(.16,1.15,.3,1),opacity .2s .05s}
.t-fly{transition:transform 1s cubic-bezier(.12,.9,.25,1),opacity .3s .1s}
.t-orbit{transition:transform 1.1s cubic-bezier(.25,.9,.3,1),opacity .35s .1s}
.t-split{transition:clip-path .6s cubic-bezier(.7,0,.2,1) .05s,opacity .01s .05s;clip-path:inset(0 50% 0 50%)}
.t-split.on{clip-path:inset(-40% -12% -40% -12%)}
.t-iris{transition:clip-path .7s cubic-bezier(.6,0,.2,1) .05s,transform .9s cubic-bezier(.2,.8,.3,1),opacity .01s .05s;clip-path:circle(0% at 50% 50%)}
.t-iris.on{clip-path:circle(110% at 50% 50%)}
.t-cascade,.t-wave{transition:opacity .01s}
.l{display:inline-block}
.t-cascade .l{opacity:0;translate:0 -.7em;rotate:-12deg;transition:translate .45s cubic-bezier(.2,1.5,.4,1),rotate .45s,opacity .15s;transition-delay:calc(var(--i)*28ms)}
.t-cascade .ws.on .l{opacity:1;translate:0 0;rotate:0deg}
.t-wave .l{opacity:0;translate:0 .55em;scale:.6;transition:translate .5s cubic-bezier(.3,1.6,.5,1),scale .5s cubic-bezier(.3,1.6,.5,1),opacity .2s;transition-delay:calc(var(--i)*35ms)}
.t-wave .ws.on .l{opacity:1;translate:0 0;scale:1}
.ex-glitch{animation:glitchOut .3s steps(1) forwards}
@keyframes glitchOut{0%{translate:0 0}25%{translate:30px -8px;opacity:.7}50%{translate:-24px 6px;opacity:.9}75%{translate:12px 0;opacity:.3}100%{translate:0 0;opacity:0}}
/* words are inline-blocks so each can move on its own (spaces live outside the spans) */
.ws{display:inline-block}
.adlib{font-family:Consolas,"Cascadia Mono",monospace;text-transform:lowercase;letter-spacing:.2em;opacity:.55}
html.lowpower .cam{animation:none}html.lowpower #light{display:none}
#bg.solid{background:#050507!important;opacity:1!important}
/* animated backgrounds: only pre-drawn layers move on the GPU (no full-screen repaints) */
#anim{position:absolute;inset:0;overflow:hidden;display:none;pointer-events:none}
html.animbg #anim{display:block}
#anim canvas{position:absolute;width:75vmax;height:75vmax;left:calc(50% - 37.5vmax);top:calc(50% - 37.5vmax);will-change:transform;opacity:.85}
#bg.drift{will-change:transform;animation:bgdrift 46s ease-in-out infinite alternate}
@keyframes bgdrift{0%{transform:scale(1.14) translate(-2.5%,-1.5%) rotate(-.6deg)}50%{transform:scale(1.24) translate(2%,1.5%) rotate(.5deg)}100%{transform:scale(1.16) translate(1%,-2%) rotate(-.3deg)}}
html.idle #bg.drift,html.idle #anim canvas{animation-play-state:paused}
#bg.custom{background:var(--bgc,#101018)!important;opacity:1!important}
#dbg{position:absolute;inset:0;pointer-events:none;display:none}
#dbg div{position:absolute;outline:3px dashed #00e5ff;outline-offset:-3px;color:#00e5ff;font:600 22px Consolas,monospace;padding:14px}
#grain{position:absolute;inset:0;transform:translateZ(0);opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

#ribbon{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent)}
#rib{position:absolute;left:0;right:0;top:0;transition:transform 1s cubic-bezier(.16,1,.3,1)}
.rl{position:absolute;left:4%;right:4%;text-align:center;white-space:nowrap;line-height:.92;transform-origin:center;
    transition:opacity .7s,transform .8s cubic-bezier(.16,1,.3,1),color .6s,-webkit-text-stroke-color .6s}
.rl.fut{opacity:.2;transform:scale(.94)}
.rl.past{opacity:.3;color:transparent;-webkit-text-stroke:max(1px,.015em) var(--text);transform:scale(.94)}
.rl.cur{opacity:1;transform:scale(1.05) skewX(-5deg)}
#ribbon .ws{opacity:1}
#ribbon .rl.cur .ws:not(.on){opacity:.25}
#ribbon .rl.cur .ws.hot{color:var(--accent)}
#echo{position:absolute;inset:0;display:flex;align-items:center;gap:calc(var(--rw)*.04);padding:0 calc(var(--rw)*.07)}
#eart{height:calc(var(--rh)*.64);aspect-ratio:1;object-fit:cover;border-radius:10px;flex:none;background:#1a1a1f;
      box-shadow:0 30px 90px rgba(0,0,0,.65);transform:rotate(-3deg)}
#etxt{min-width:0;flex:1}
.elab{font-size:calc(var(--rh)*.017);opacity:.5;margin-bottom:calc(var(--rh)*.014)}
#etitle{line-height:.88;white-space:nowrap}
#eartist{font-size:calc(var(--rh)*.065);opacity:.8;margin:calc(var(--rh)*.012) 0 calc(var(--rh)*.06);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#enext{font-size:calc(var(--rh)*.055);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .35s,transform .5s cubic-bezier(.16,1,.3,1)}
#enext.swap{opacity:0;transform:translateX(calc(var(--rw)*.03))}
#ticker{transition:opacity .6s;position:absolute;left:0;bottom:calc(var(--rh)*.04);white-space:nowrap;font:900 calc(var(--rh)*.24)/1 "Bahnschrift","Segoe UI Black",sans-serif;text-transform:uppercase;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.06);animation:tick 90s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

#stage{position:absolute;inset:0}
#hud{pointer-events:none}#hud #sync{pointer-events:auto}
.box{position:absolute;overflow:visible;will-change:transform}
#dbg .scene{outline-color:#ffd400;color:#ffd400;text-align:right}
.exit,.cam{position:absolute;inset:0;transform-origin:center}
.exit{transition:transform .6s cubic-bezier(.6,0,.4,1),opacity .55s ease .05s}
.cam{animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:rotate(-.6deg) scale(1)}to{transform:rotate(.6deg) scale(1.012)}}
.grp{position:absolute;inset:0;pointer-events:none}
.u{position:absolute;left:0;top:0;white-space:nowrap;line-height:.9;
   will-change:auto}
.ws{opacity:0;transition:opacity .25s}
.ws.on{opacity:1}
.ws.hot{text-shadow:0 0 var(--glow,.12em) color-mix(in srgb,var(--accent) 70%,transparent)}

.f-cond{font-family:"Bahnschrift","Microsoft YaHei UI","Yu Gothic UI","Malgun Gothic",sans-serif;font-weight:700;font-stretch:condensed;font-variation-settings:"wdth" 75,"wght" 700;text-transform:uppercase;letter-spacing:-.01em}
.f-black{font-family:"Segoe UI Black","Segoe UI","Microsoft YaHei","Yu Gothic","Malgun Gothic",sans-serif;font-weight:900;letter-spacing:-.04em}
.f-impact{font-family:Impact,Haettenschweiler,"Microsoft YaHei","Yu Gothic","Malgun Gothic",sans-serif;text-transform:uppercase}
.f-serif{font-family:Georgia,"Times New Roman","SimSun","Yu Mincho","Batang",serif;font-style:italic;font-weight:400;letter-spacing:-.02em}
.f-mono{font-family:Consolas,"Cascadia Mono","MS Gothic","SimHei",monospace;text-transform:uppercase;letter-spacing:.35em;font-weight:400}

.acc{color:var(--accent)}
.outline{color:transparent;-webkit-text-stroke:max(1.5px,.018em) var(--text)}
.outline.acc{-webkit-text-stroke-color:var(--accent)}
.ghost{color:transparent;-webkit-text-stroke:max(1px,.012em) var(--text)}

#info{position:absolute;left:calc(var(--rw)*.032);bottom:calc(var(--rh)*(.036 + var(--hudlift,0)));display:flex;align-items:center;gap:14px;font-family:"Segoe UI Variable Text","Segoe UI",sans-serif;opacity:.85}
#art{width:54px;height:54px;border-radius:6px;object-fit:cover;background:#222;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#t{font-weight:700;font-size:15px;max-width:calc(var(--rw)*.3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#a{font-size:13px;opacity:.65;margin-top:2px}
#bar{width:180px;height:2px;background:rgba(255,255,255,.15);margin-top:8px;border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--accent);will-change:transform}
#sync{position:absolute;right:calc(var(--rw)*.032);bottom:calc(var(--rh)*(.036 + var(--hudlift,0)) + 22px);display:flex;gap:6px;align-items:center;font:12px Consolas,monospace;opacity:.18;transition:opacity .3s}
#sync:hover{opacity:1}
#sync button{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:4px 8px;font:inherit;cursor:pointer}
#sync button:hover{border-color:var(--accent);color:var(--accent)}
#nv{min-width:52px;text-align:center}
#status{position:absolute;right:calc(var(--rw)*.032);bottom:calc(var(--rh)*(.036 + var(--hudlift,0)));font:12px Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;opacity:.45}
</style>
</head>
<body>
<div id="bg"></div><div id="anim"></div><div id="shade"></div><div id="flash"></div><canvas id="light" width="256" height="256"></canvas>
<div id="fg">
<div id="rMain" class="reg">
  <div id="tickbox" class="reg"><div id="ticker"></div></div>
  <div id="stage"></div>
  <div id="hud" class="reg">
  <div id="info"><img id="art" alt=""><div><div id="t"></div><div id="a"></div><div id="bar"><i></i></div></div></div>
  <div id="sync"><button data-d="0.1" title="show lyrics earlier">« earlier</button><span id="nv">0.00s</span><button data-d="-0.1" title="show lyrics later">later »</button><button data-d="0" title="reset">↺</button><button data-r="1" title="reload lyrics, audio and clock">⟳</button></div>
  <div id="status"></div></div>
</div>
<div id="rRib" class="reg"><div id="ribbon"><div id="rib"></div></div></div>
<div id="rEcho" class="reg"><div id="echo"><img id="eart" alt=""><div id="etxt">
  <div class="elab f-mono">now playing</div><div id="etitle" class="f-cond"></div><div id="eartist" class="f-serif"></div>
  <div class="elab f-mono">next</div><div id="enext" class="f-black"></div></div></div></div>
</div>

<div id="dbg"></div><div id="clk"></div>

<script>
const STRIP=window.__STRIP??0;
if(STRIP>=1)document.documentElement.classList.add('s1');if(STRIP>=2)document.documentElement.classList.add('s2');if(STRIP>=3)document.documentElement.classList.add('s3');
const $=id=>document.getElementById(id), root=document.documentElement, stage=$('stage');
const fg=$('fg'),R={main:$('rMain'),ribbon:$('rRib'),echo:$('rEcho')};
let W=1920,H=1080,RW=1440,RH=2560,EW=1920,EH=1080;          // main / portrait feed / side panel sizes
const VIS={main:true,ribbon:false,echo:false};
const S={title:'',artist:'',album:'',playing:false,basePos:0,baseT:performance.now(),dur:0,offset:0,
         lines:[],idx:-99,slew:0,lastTL:null,lastTLT:0,reqId:0,beat:0,beatS:0,autoAccent:true,manualAccent:'#ff4d6d',lastComp:'',cur:null,cache:new Map()};
S.lagLo=0;S.lagHi=.25;
S.snapBias=.5;try{const b=parseFloat(localStorage.getItem('kl:snapBias'));if(isFinite(b))S.snapBias=b}catch(e){}
const SY={key:'',on:[],prev:0,avg:.02,last:-1,auto:0,nudge:0,lastCalc:0,enabled:false,flashT:0};
// only re-layout on a real, settled size change (WE can fire resize spam / 0x0 at startup)
let rzT=0;
addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(layout,350)});

let RNG=null;const RR=()=>RNG?RNG():Math.random();
const FONT_W={calm:{'f-serif':3,'f-mono':2,'f-cond':2,'f-black':.6,'f-impact':.3},intense:{'f-impact':3,'f-black':2.5,'f-cond':2,'f-serif':.4,'f-mono':.5}};
const rnd=(a,b)=>a+RR()*(b-a), pick=a=>{
  // mood-weighted choice when picking fonts
  const fb=S.fontBias;if(fb&&a.length>1&&typeof a[0]==='string'&&a[0].startsWith('f-')){
    const w=a.map(f=>FONT_W[fb][f]??1),t=w.reduce((x,y)=>x+y,0);let r=RR()*t;for(let i=0;i<a.length;i++){r-=w[i];if(r<=0)return a[i]}return a[a.length-1]}
  return a[Math.floor(RR()*a.length)]};
const hashStr=t=>{let h=2166136261;for(const c of t)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const seeded=seed=>()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(RR()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const T=(x,y,r=0,s=1)=>`translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s})`;
const status=m=>$('status').textContent=m;
const baseClock=()=>S.basePos+(S.playing?(performance.now()-S.baseT)/1000:0);
const rawPos=()=>baseClock()+(S.kCur||0);
const pos=()=>rawPos()+S.offset/1000+SY.nudge+(SY.enabled?SY.auto:0);

/* ---------- measuring ---------- */
const meas=document.createElement('span');
meas.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font-size:100px;line-height:.9;left:-99999px;top:0';
document.body.appendChild(meas);
function measure(text,font){meas.className=font;meas.textContent=text;return{w:Math.max(1,meas.offsetWidth),h:Math.max(1,meas.offsetHeight)}}
function chunk(ids,words,max){const rows=[];let cur=[],len=0;for(const i of ids){const l=words[i].length;if(cur.length&&len+l>max){rows.push(cur);cur=[];len=0}cur.push(i);len+=l+1}if(cur.length)rows.push(cur);return rows}

/* ---------- compositions ---------- */
// Stream path: the lyrics run as one continuous path through space — a sideways run, then it turns and drops down,
// cuts a diagonal, runs vertically, or wraps round a spinning flywheel — and the camera rides along it word by word
const PHASES=['right','down','diag','vert','wheel','wave','crescendo','rise','slam','arc'];
const PH_VERT=['down','vert','slam'];
function compStream(words){
  S.lastComp='stream';
  let P=ST.path;
  if(!P||!ST.live.length){const h=hashStr((S.title||'')+'|path'+S.idx)>>>0;P=ST.path={x:0,y:0,phase:['right','diag','right','down'][h%4],n:0,len:2+h%2,font:['f-cond','f-impact','f-black'][(h>>>3)%3],lastWheel:-99,k:0}}
  else if(P.n>=P.len){const h=hashStr(words.join(' ')+'|ph'+S.idx)>>>0;
    let opts=PHASES.filter(p=>p!==P.phase&&!(p==='wheel'&&(S.idx-P.lastWheel<10||P.phase==='vert'))&&!(p==='slam'&&(S.idx-(P.lastSlam??-99)<6||words.length>4))&&!((p==='down'||p==='vert')&&words.length>8)&&!(p==='arc'&&S.idx-(P.lastArc??-99)<5));
    // read the moment: builds climb, big moments slam, calm stretches drift
    const L=S.lines[S.idx],nx=S.lines[S.idx+1],sec=L&&L.sec&&L.sec.type,nsec=nx&&nx.sec&&nx.sec.type;
    const build=sec==='pre'||(nsec==='chorus'&&sec!=='chorus'),big=sec==='chorus'||S.fontBias==='intense',calm=sec==='verse'&&S.fontBias==='calm';
    const pref=build?['crescendo','rise']:big?['slam','diag','wave','crescendo']:calm?['wave','arc','down','right']:null;
    const pp=pref&&opts.filter(p=>pref.includes(p));
    let np=pp&&pp.length&&(h>>>8)%10<7?pp[(h>>>12)%pp.length]:opts[h%opts.length];if(S.forcePh&&S.forcePh.length)np=S.forcePh.shift();if(np==='slam'&&words.length>4)np='crescendo';
    // turn the corner from where the last line ended
    const b=H*.15,wasV=PH_VERT.includes(P.phase),isV=PH_VERT.includes(np);
    if(isV){P.y+=b*1.25;if(!wasV)P.x-=H*.3}
    else{P.y+=b*.9;if(P.phase==='wheel'||P.phase==='arc')P.y-=b*.9;if(wasV)P.x=Math.max(P.x,P.ex||P.x)+b*.4;if(np==='rise')P.y+=b*1.2}
    P.phase=np;P.n=0;P.len=np==='wheel'||np==='arc'?1:np==='slam'?1+(h>>>4)%2:1+(h>>>4)%3;
    if(np==='wheel')P.lastWheel=S.idx;if(np==='slam')P.lastSlam=S.idx;if(np==='arc')P.lastArc=S.idx}
  P.n++;P.k++;if((P.phase==='wheel'||P.phase==='arc')&&P.n===1)P.x=Math.max(P.x,P.ex||P.x)+H*.15;
  const font=P.font||'f-black',base=H*.15,us=[],mm=words.map(w=>measure(w,font));
  let longest=0;words.forEach((w,i)=>{if(w.length>words[longest].length)longest=i});
  const unit=(i,fs,x,y,r,mods,fx,fy)=>({ids:[i],font,fs,x,y,r,mods,from:{x:x+fx,y:y+fy,r,s:1}});

  wallpaperRegisterMediaPlaybackListener(e=>{try{DG.ev('play',String(e&&e.state))}catch(x){}const pl=e.state===window.wallpaperMediaIntegration.PLAYBACK_PLAYING;S.pbCount=(S.pbCount||0)+1;S.pbState=pl;if(pl===S.playing)return;const p=baseClock();S.playing=pl;if(!pl)S.idleSince=performance.now();S.basePos=p;S.baseT=performance.now()});
  wallpaperRegisterMediaTimelineListener(e=>{
    if(!e)return;const now=performance.now(),pos=+e.position;if(!isFinite(pos)||pos<0||pos>36000)return;S.tlCount=(S.tlCount||0)+1;S.tlRaw=pos;try{DG.tl();DG.ev('time',pos.toFixed(0)+'/'+(+e.duration||0).toFixed(0))}catch(e){}
    {const nd=+e.duration;
     if(isFinite(nd)&&nd>0&&S.dur>0&&Math.abs(nd-S.dur)>1.5&&pos<8&&S.lines.length&&!S.pendTrack){
       // Spotify often sends the new song's timeline before its title: stop showing the old song's lyrics right away
       S.pendTrack={lines:S.lines,src:S.src,at:now};S.reqId++;S.lines=[];S.idx=-99;status('next song…');
       setTimeout(()=>{const P=S.pendTrack;if(P&&P.at===now){S.pendTrack=null;S.lines=P.lines;S.src=P.src;S.idx=-99;status(S.src)}},8000)}   // no new title came: it was the same song
     if(isFinite(nd)&&nd>0)S.dur=nd}
    const first=S.lastTL==null,same=!first&&Math.abs(pos-S.lastTL)<.02;
    if(same){S.tlStale=(S.tlStale||0)+1;return}                  // same value re-sent: stale, ignore it
    // judge the report against the previous REPORT, not against our running clock
    const dtR=first?0:(now-S.lastTLT)/1000,adv=first?0:pos-S.lastTL;
    S.lastTL=pos;S.lastTLT=now;
    if(!first&&adv>0&&S.pbState!==false)S.playing=true;
    // Spotify reports whole seconds (floor), so the true position is in [pos, pos+1) + a little report lag.
    // Spotify reports floor(seconds). Each report says: true position is in [pos, pos+1).
    // Intersect those windows over time -> the clock's correction narrows to the real phase.
    const c=baseClock(),lo=pos-c,hi=pos+1-c,est=c+(S.kCur||0);
    // rounding + report lag can make a report up to ~1.3s 'earlier' than the last one; only bigger jumps are real seeks
    const seek=first||adv<-1.6||adv>dtR+2.2||est<pos-1.8||est>pos+2.8;
    if(seek||!S.playing){S.basePos=pos;S.baseT=now;S.kCur=S.snapBias;S.kLo=S.kHi=S.snapBias;S.kRes=[0];S.kLearned=false;SY.last=-1;S.snaps=(S.snaps||0)+1}
    else{
      // Each report is floor(true position at some earlier moment): it can only be BEHIND the song, never ahead.
      // So the true correction k >= every residual, and the largest residual is a hard lower bound.
      // k sits just above it; the expected gap shrinks as reports pile up (~1.15/(n+1)).
      S.kRes.push(lo);if(S.kRes.length>14)S.kRes.shift();
      const n=S.kRes.length,mx=Math.max(...S.kRes),mn=Math.min(...S.kRes);S.kSpread=mx-mn;
      const est=mx+1.15/(n+1);S.kLo=S.kHi=est;
      // remember the settled value so the next song / seek starts already compensated
      if(n>=10&&!S.kLearned){S.kLearned=true;S.snapBias=Math.max(-1.5,Math.min(2,S.snapBias*.5+est*.5));
        try{localStorage.setItem('kl:snapBias',S.snapBias.toFixed(3))}catch(e){}}
    }
  });
  if(window.wallpaperRegisterAudioListener)wallpaperRegisterAudioListener(onAudio);
  status('waiting for music…');
}else{
  /* browser preview with placeholder text */
  const Q=new URLSearchParams(location.search);
  S.layoutMode=Q.get('layout')||'single';S.layout=Q.get('wl')||S.layout;if(Q.has('chaos'))S.chaos=+Q.get('chaos');S.theme=Q.get('theme')||S.theme;S.role=ROLE[Q.get('role')||'main'];S.debug=Q.has('debug');layout();
  setTrack('Preview Mode','Kinetic Lyrics','');
  S.reqId++;status('preview');
  const demo=['type in motion','every line a different shape','big','words that fall and shatter','outline and fill and colour in between','stack it up','tilt','the beat keeps the camera breathing','',
              'one more time from the top'];
  S.lines=demo.map((text,i)=>({t:2+i*3.2,text}));S.dur=demo.length*3.2+4;S.playing=true;S.basePos=+location.hash.slice(1)||0;S.baseT=performance.now();
  setInterval(()=>{if(rawPos()>S.dur){S.basePos=0;S.baseT=performance.now()}},500);
  (function fake(){const t=performance.now()/1000,b=Math.max(0,Math.sin(t*Math.PI*4))**8,d=(t%12)>9;
    const a=new Array(128).fill(0).map((_,k)=>{const f=k%64;return f<5?b*.5:f<30?.05+.04*Math.sin(t*3):f>36?(Math.random()<.2?.08:.01)+(d?.12+Math.random()*.1:0):.02+(d?.1+Math.random()*.1:0)});
    onAudio(a.map(v=>v*(window.__amp??1)));requestAnimationFrame(fake)})();
}
